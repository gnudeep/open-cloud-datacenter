---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: dbinstances.dbaas.opencloud.wso2.com
spec:
  group: dbaas.opencloud.wso2.com
  names:
    kind: DBInstance
    listKind: DBInstanceList
    plural: dbinstances
    shortNames:
    - dbi
    singular: dbinstance
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.dbInstanceClass
      name: Class
      type: string
    - jsonPath: .status.endpoint.address
      name: Endpoint
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          DBInstance represents a managed PostgreSQL database on Harvester HCI.
          Namespaced — each DBInstance lives in a tenant namespace. All Harvester
          child resources (VM, DataVolume, Secret, Service, ServiceMonitor) are
          created in the same namespace as the DBInstance.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: DBInstanceSpec defines the desired state of a managed PostgreSQL
              database.
            properties:
              allocatedStorage:
                description: AllocatedStorage in GiB.
                type: integer
              backupRetentionPeriod:
                description: BackupRetentionPeriod in days. 0 = disabled. Default
                  7.
                type: integer
              consumerNetwork:
                description: |-
                  ConsumerNetwork is the Harvester NAD reference (namespace/name) for a
                  consumer VLAN that application workloads use to reach the database
                  directly via L2. When set, the VM gets a third NIC bridged to this
                  network. Example: "default/vm-net-100".
                type: string
              dbInstanceClass:
                description: DBInstanceClass maps to CPU/RAM. e.g. "db.t3.medium",
                  "db.m5.large".
                type: string
              dbName:
                description: DBName is the initial database to create.
                type: string
              dbParameterGroupRef:
                description: DBParameterGroupRef references a DBParameterGroup by
                  name.
                type: string
              dbSubnetGroupName:
                description: DBSubnetGroupName is the consumer VLAN CIDR or Kube-OVN
                  subnet for app access.
                type: string
              deletionProtection:
                description: DeletionProtection prevents accidental deletion.
                type: boolean
              engineVersion:
                description: EngineVersion is the PostgreSQL major version. Default
                  "16".
                type: string
              manageMasterUserPassword:
                description: |-
                  ManageMasterUserPassword: if true, auto-generate and store in a K8s Secret.
                  If false, read from MasterUserPasswordRef.
                type: boolean
              masterUserPasswordRef:
                description: MasterUserPasswordRef points to a K8s Secret containing
                  the user-supplied password.
                properties:
                  key:
                    type: string
                  name:
                    type: string
                required:
                - key
                - name
                type: object
              masterUsername:
                description: MasterUsername for the admin user. Default "dbadmin".
                type: string
              multiAZ:
                description: MultiAZ enables Patroni HA with a standby VM.
                type: boolean
              networkRef:
                description: |-
                  NetworkRef is a Harvester NAD reference (namespace/name) for an existing
                  VLAN network to attach the VM to as its primary NIC. When set, the
                  controller skips Kube-OVN VPC/Subnet/NAD creation and uses this NAD
                  directly. Use this on clusters where Kube-OVN VPC is not available.
                  Example: "iaas-net/vm-subnet-001".
                type: string
              osImage:
                description: |-
                  OSImage is the Harvester VM image name.
                  Default "ubuntu-22.04-server-cloudimg-amd64.img".
                type: string
              port:
                description: Port for PostgreSQL. Default 5432.
                type: integer
              preferredBackupWindow:
                description: PreferredBackupWindow in UTC. e.g. "02:00-03:00".
                type: string
              running:
                default: true
                description: Running controls the VM power state. false = stopped
                  (storage preserved).
                type: boolean
              s3BackupConfig:
                description: S3BackupConfig for pgBackRest S3 target.
                properties:
                  bucket:
                    type: string
                  endpoint:
                    type: string
                  region:
                    type: string
                  secretRef:
                    description: SecretRef is a K8s Secret name with accessKey + secretKey.
                    type: string
                required:
                - bucket
                - endpoint
                - secretRef
                type: object
              storageType:
                description: StorageType maps to a Longhorn StorageClass. Default
                  "longhorn".
                type: string
              tags:
                additionalProperties:
                  type: string
                description: Tags are user-defined labels.
                type: object
              vmPassword:
                description: |-
                  VMPassword sets the default console/SSH password for the VM user (ubuntu).
                  For development and debugging only — leave empty in production.
                type: string
              vpcPeering:
                description: |-
                  VpcPeering configures Kube-OVN VPC peering between the DBaaS VPC and an
                  external VPC (e.g. the RKE2 cluster VPC) so application pods can reach the
                  database without being co-located in the DBaaS namespace.
                properties:
                  remoteSubnet:
                    description: RemoteSubnet is the Kube-OVN subnet name in the remote
                      VPC.
                    type: string
                  remoteVpc:
                    description: RemoteVpc is the name of the Kube-OVN VPC to peer
                      with (e.g. the RKE2 cluster VPC).
                    type: string
                required:
                - remoteSubnet
                - remoteVpc
                type: object
            required:
            - allocatedStorage
            - dbInstanceClass
            type: object
          status:
            description: DBInstanceStatus defines the observed state of a DBInstance.
            properties:
              caCertPem:
                description: CACertPEM is the generated CA for SSL verification.
                type: string
              conditions:
                description: Conditions for each sub-resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              endpoint:
                description: Endpoint is populated when the database is reachable.
                properties:
                  address:
                    type: string
                  jdbcUrl:
                    type: string
                  port:
                    type: integer
                required:
                - address
                - port
                type: object
              grafanaUrl:
                description: GrafanaURL is the per-instance Grafana dashboard URL.
                type: string
              masterUserSecret:
                description: MasterUserSecret references the K8s Secret with credentials.
                properties:
                  name:
                    type: string
                  status:
                    description: Status is "active" or "impaired".
                    type: string
                required:
                - name
                - status
                type: object
              message:
                description: Message is a human-readable description of the current
                  state.
                type: string
              observedGeneration:
                description: ObservedGeneration tracks which spec version has been
                  reconciled.
                format: int64
                type: integer
              phase:
                description: Phase matches RDS DBInstanceStatus strings.
                type: string
              prometheusTarget:
                description: PrometheusTarget is the scrape target for the instance's
                  metrics exporter.
                type: string
              provisioningPhase:
                description: ProvisioningPhase tracks which reconcile step we're on.
                type: string
              readReplicas:
                description: ReadReplicas tracks child replica identifiers.
                items:
                  type: string
                type: array
              resources:
                description: Resources tracks every Harvester object created for cleanup
                  and idempotency.
                properties:
                  dataVolumeName:
                    type: string
                  nadName:
                    type: string
                  secretName:
                    type: string
                  serviceMonitor:
                    type: string
                  subnetName:
                    type: string
                  vmName:
                    type: string
                  vpcName:
                    type: string
                  vpcPeeringName:
                    type: string
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
